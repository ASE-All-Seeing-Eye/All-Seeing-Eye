[project]
name = "all-seeing-eye"
version = "0.1.0"
description = "Backend for All Seeing Eye"
authors = [
    { name = "Salih Hane", email = "2202@htl.rennweg.at" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.1",
    "netmiko>=4.8.0",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.5",
    "pyats[library]>=26.9 ; sys_platform != 'win32'",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
